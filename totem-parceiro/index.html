<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Totem Parceiro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c1821;color:#fff;min-height:100vh;overflow-x:hidden}

/* ===== TELA DE LOGIN ===== */
.login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0c1821,#1a3a52,#0c4a6e);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-screen.hidden{display:none}
.login-card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:44px 38px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-icon{font-size:64px;margin-bottom:14px}
.login-card h1{font-size:26px;font-weight:900;letter-spacing:2px;margin-bottom:6px;color:#fff}
.login-sub{color:rgba(255,255,255,.65);font-size:13px;margin-bottom:32px;letter-spacing:1px}
.login-input{width:100%;padding:16px 20px;border:2px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-size:18px;font-family:inherit;text-align:center;letter-spacing:4px;outline:none;font-weight:700;transition:all .3s}
.login-input::placeholder{color:rgba(255,255,255,.35);letter-spacing:2px;font-weight:400}
.login-input:focus{border-color:#22d3ee;background:rgba(255,255,255,.12);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.login-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;transition:all .3s;font-family:inherit;letter-spacing:1px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,211,238,.3)}
.login-btn:active{transform:scale(.98)}
.login-error{color:#fca5a5;font-size:13px;font-weight:600;margin-top:14px;min-height:20px}
.login-hint{margin-top:24px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.7}
.login-shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-10px)}30%,60%,90%{transform:translateX(10px)}}

/* ===== HEADER COM IDENTIFICAÇÃO DO PARQUE ===== */
.app-content{display:none;min-height:100vh}
.app-content.show{display:block}
.parque-header{padding:24px 20px;text-align:center;position:relative}
.parque-icon{font-size:54px;margin-bottom:8px}
.parque-nome{font-size:28px;font-weight:900;letter-spacing:2px;margin-bottom:4px}
.parque-tag{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:3px;text-transform:uppercase}
.parque-badge{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:2px;background:rgba(34,211,238,.2);color:#7dd3fc;border:1px solid rgba(34,211,238,.3)}
.btn-logout-totem{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}
.btn-logout-totem:hover{background:rgba(229,62,62,.3);color:#fff}

.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-size:10px;font-weight:700;margin-top:6px}
.sync-on{background:rgba(56,161,105,.25);color:#9ae6b4}
.sync-off{background:rgba(229,62,62,.25);color:#feb2b2}
.sync-dot{width:8px;height:8px;border-radius:50%}
.sync-dot.on{background:#68d391;animation:pulse 2s infinite}
.sync-dot.off{background:#fc8181}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== ÁREA DE SCAN ===== */
.scan-area{max-width:600px;margin:0 auto;padding:20px}
.scan-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;margin-bottom:20px}
.scan-title{font-size:14px;font-weight:700;letter-spacing:1.5px;color:#7dd3fc;margin-bottom:16px;text-align:center;text-transform:uppercase}
.qr-reader{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1;max-width:380px;margin:0 auto}
.qr-reader video{width:100%;height:100%;display:block;object-fit:cover}
.scan-frame{position:absolute;top:15%;left:15%;right:15%;bottom:15%;border:3px solid rgba(34,211,238,.6);border-radius:16px;z-index:1;pointer-events:none}
.scan-line{position:absolute;left:18%;right:18%;height:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);top:30%;z-index:2;animation:scan 2.2s ease-in-out infinite;box-shadow:0 0 20px #22d3ee}
@keyframes scan{0%,100%{top:22%}50%{top:78%}}
.scan-instruction{text-align:center;font-size:13px;color:rgba(255,255,255,.7);margin-top:14px;letter-spacing:.5px}

/* ===== STATUS / RESULTADO ===== */
.result-card{display:none;border-radius:20px;padding:30px 24px;text-align:center;margin-bottom:20px}
.result-card.show{display:block;animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.result-card.ok{background:linear-gradient(135deg,#22543d,#38a169)}
.result-card.ng{background:linear-gradient(135deg,#742a2a,#e53e3e)}
.result-icon{font-size:80px;margin-bottom:10px}
.result-title{font-size:32px;font-weight:900;letter-spacing:2px;margin-bottom:14px}
.result-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:5px solid rgba(255,255,255,.4);margin:0 auto 14px;display:block}
.result-name{font-size:22px;font-weight:800;margin-bottom:8px}
.result-info{font-size:13px;opacity:.9;margin-bottom:16px}
.result-action{margin-top:16px}
.btn-confirm{background:#fff;color:#22543d;border:none;padding:16px 36px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:all .2s;width:100%;max-width:300px}
.btn-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.btn-confirm:active{transform:scale(.97)}
.btn-confirm:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:12px 28px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px}

/* ===== HISTÓRICO LOCAL ===== */
.hist-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-bottom:20px}
.hist-title{font-size:13px;font-weight:700;letter-spacing:1.5px;color:#7dd3fc;margin-bottom:14px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.hist-count{background:rgba(34,211,238,.2);color:#7dd3fc;padding:4px 10px;border-radius:10px;font-size:11px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.hist-item:last-child{border-bottom:none}
.hist-time{font-size:11px;color:rgba(255,255,255,.5);min-width:54px}
.hist-name{flex:1;font-weight:600}
.hist-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.hist-ok{background:rgba(56,161,105,.3);color:#9ae6b4}
.hist-ng{background:rgba(229,62,62,.3);color:#feb2b2}
.hist-empty{text-align:center;padding:20px;color:rgba(255,255,255,.4);font-size:12px}

.toast-box{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9998}
.toast{background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.2);padding:12px 22px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;margin-bottom:6px;animation:slideDown .3s}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

@media(max-width:480px){
    .login-card{padding:36px 26px}
    .parque-nome{font-size:22px}
    .result-title{font-size:26px}
    .result-name{font-size:18px}
}
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-icon">🤝</div>
        <h1>TOTEM PARCEIRO</h1>
        <div class="login-sub">ACESSO RESTRITO</div>
        <input type="password" class="login-input" id="senhaInput" placeholder="DIGITE A SENHA" maxlength="20" onkeydown="if(event.key==='Enter')validarSenha()" autofocus>
        <button class="login-btn" onclick="validarSenha()">🔓 ENTRAR</button>
        <div class="login-error" id="loginErro"></div>
        <div class="login-hint">
            🔒 Cada parque possui sua senha exclusiva.<br>
            Em caso de dúvidas, contate o administrador.
        </div>
    </div>
</div>

<!-- ===== APP CONTENT ===== -->
<div class="app-content" id="appContent">
    <div class="parque-header">
        <button class="btn-logout-totem" onclick="logoutTotem()">🚪 Sair</button>
        <div class="parque-icon" id="parqueIcon">🌊</div>
        <div class="parque-nome" id="parqueNome">PARQUE</div>
        <div class="parque-tag">CLUBE PARCEIRO</div>
        <div class="parque-badge" id="parqueBadge">ACQUA CARD</div>
        <div id="syncStatus" style="margin-top:8px"></div>
    </div>

    <div class="scan-area">
        <div class="scan-box">
            <div class="scan-title">📷 Escanear QR Code</div>
            <div class="qr-reader" id="qrReader">
                <video id="video" playsinline></video>
                <div class="scan-frame"></div>
                <div class="scan-line"></div>
            </div>
            <div class="scan-instruction">Posicione o QR Code do Acqua Card na área marcada</div>
            <canvas id="canvas" style="display:none"></canvas>
        </div>

        <div class="result-card" id="resultCard"></div>

        <div class="hist-box">
            <div class="hist-title">
                <span>📊 Acessos de Hoje</span>
                <span class="hist-count" id="histCount">0</span>
            </div>
            <div id="histList"><div class="hist-empty">Nenhum acesso registrado hoje</div></div>
        </div>
    </div>
</div>

<div class="toast-box" id="toastBox"></div>

<script>
/* ===== CONFIGURAÇÃO DE SENHAS POR PARQUE ===== */
var SENHAS_PARQUES={
    'RIVIERA2026':{id:'riviera',nome:'RIVIERA',icon:'🌊',cor:'#22d3ee'},
    'CASTELLUS2026':{id:'castellus',nome:'CASTELLUS',icon:'🏰',cor:'#d4a853'},
    'VALEBEACH2026':{id:'valebeach',nome:'VALE BEACH',icon:'🏖️',cor:'#a78bfa'}
};

var FB_URL='https://aqcuacard-default-rtdb.firebaseio.com';
var PARQUE_ATUAL=null;
var db=[];
var visitasHoje=[];
var stream=null;
var scanning=false;
var ultimoScan=0;
var assocPendente=null;
var isOnline=false;

/* ===== LOGIN / VALIDAÇÃO DE SENHA ===== */
function validarSenha(){
    var inp=document.getElementById('senhaInput');
    var erro=document.getElementById('loginErro');
    var card=document.querySelector('.login-card');
    var senha=inp.value.trim().toUpperCase();

    if(!senha){
        erro.textContent='⚠️ Digite a senha';
        return;
    }

    if(SENHAS_PARQUES[senha]){
        PARQUE_ATUAL=SENHAS_PARQUES[senha];
        sessionStorage.setItem('totem_parque_senha',senha);
        entrarApp();
    }else{
        erro.textContent='⛔ Senha incorreta';
        card.classList.add('login-shake');
        inp.value='';
        inp.focus();
        setTimeout(function(){card.classList.remove('login-shake');},500);
    }
}

function checarSessaoTotem(){
    var s=sessionStorage.getItem('totem_parque_senha');
    if(s&&SENHAS_PARQUES[s]){
        PARQUE_ATUAL=SENHAS_PARQUES[s];
        entrarApp();
    }else{
        document.getElementById('senhaInput').focus();
    }
}

function entrarApp(){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appContent').classList.add('show');
    document.getElementById('parqueIcon').textContent=PARQUE_ATUAL.icon;
    document.getElementById('parqueNome').textContent=PARQUE_ATUAL.nome;
    document.getElementById('parqueBadge').textContent='✓ '+PARQUE_ATUAL.nome+' AUTENTICADO';
    document.title=PARQUE_ATUAL.nome+' - Totem Parceiro';
    iniciarTotem();
}

function logoutTotem(){
    if(!confirm('Sair do totem?\n\nVocê precisará digitar a senha novamente.'))return;
    sessionStorage.removeItem('totem_parque_senha');
    pararCamera();
    location.reload();
}

/* ===== UTILS ===== */
function hoje(){return new Date().toLocaleDateString('pt-BR');}
function agora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function hojeISO(){return new Date().toISOString().substr(0,10);}
function toast(msg){var c=document.getElementById('toastBox'),d=document.createElement('div');d.className='toast';d.textContent=msg;c.appendChild(d);setTimeout(function(){d.remove();},3000);}
function find(id){for(var i=0;i<db.length;i++)if(db[i].id===id)return db[i];return null;}

/* ===== FIREBASE ===== */
function fbGet(p,cb){var x=new XMLHttpRequest();x.open('GET',FB_URL+'/'+p+'.json',true);x.timeout=8000;x.onload=function(){if(x.status===200)try{cb(null,JSON.parse(x.responseText));}catch(e){cb(e);}else cb(new Error(x.status));};x.onerror=function(){cb(new Error('Net'));};x.ontimeout=function(){cb(new Error('Timeout'));};x.send();}
function fbPost(p,d,cb){var x=new XMLHttpRequest();x.open('POST',FB_URL+'/'+p+'.json',true);x.setRequestHeader('Content-Type','application/json');x.timeout=8000;x.onload=function(){if(cb)try{cb(null,JSON.parse(x.responseText));}catch(e){cb(e);}};x.onerror=function(){if(cb)cb(new Error('Net'));};x.send(JSON.stringify(d));}

function updateSync(){
    var el=document.getElementById('syncStatus');
    if(isOnline)el.innerHTML='<div class="sync-pill sync-on"><div class="sync-dot on"></div>SINCRONIZADO</div>';
    else el.innerHTML='<div class="sync-pill sync-off"><div class="sync-dot off"></div>OFFLINE</div>';
}

function carregarAssociados(){
    fbGet('associados',function(e,d){
        if(!e&&d){
            db=[];
            for(var k in d){var a=d[k];a._fbKey=k;db.push(a);}
            isOnline=true;updateSync();
        }else{isOnline=false;updateSync();}
    });
    fbGet('visitas_parceiros',function(e,d){
        if(!e&&d){
            visitasHoje=[];
            for(var k in d){
                var v=d[k];
                if(v.parqueId===PARQUE_ATUAL.id&&v.dt===hoje())visitasHoje.push(v);
            }
            renderHistorico();
        }
    });
}

/* ===== RENDERIZA HISTÓRICO LOCAL ===== */
function renderHistorico(){
    var lista=visitasHoje.slice().sort(function(a,b){return(b.ts||0)-(a.ts||0);});
    document.getElementById('histCount').textContent=lista.length;
    if(!lista.length){
        document.getElementById('histList').innerHTML='<div class="hist-empty">Nenhum acesso registrado hoje</div>';
        return;
    }
    document.getElementById('histList').innerHTML=lista.slice(0,30).map(function(v){
        var ok=v.tp==='ok';
        return '<div class="hist-item">'+
            '<div class="hist-time">'+v.hr.substr(0,5)+'</div>'+
            '<div class="hist-name">'+v.nome+'</div>'+
            '<div class="hist-status '+(ok?'hist-ok':'hist-ng')+'">'+(ok?'✓ OK':'⊘ Bloq')+'</div>'+
        '</div>';
    }).join('');
}

/* ===== CÂMERA E QR ===== */
function loadJsQR(cb){
    if(typeof jsQR!=='undefined')return cb();
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload=cb;
    document.head.appendChild(s);
}

function iniciarTotem(){
    carregarAssociados();
    setInterval(carregarAssociados,15000);
    iniciarCamera();
}

function iniciarCamera(){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
        stream=s;
        var v=document.getElementById('video');
        v.srcObject=s;v.play();
        scanning=true;
        loadJsQR(function(){scanLoop();});
    }).catch(function(e){toast('⚠️ Erro câmera: '+e.message);});
}

function pararCamera(){
    scanning=false;
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
}

function scanLoop(){
    if(!scanning)return;
    var v=document.getElementById('video'),c=document.getElementById('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    if(v.readyState===v.HAVE_ENOUGH_DATA){
        c.width=v.videoWidth;c.height=v.videoHeight;
        x.drawImage(v,0,0);
        if(typeof jsQR!=='undefined'){
            var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
            if(r&&r.data){
                var now=Date.now();
                if(now-ultimoScan>3000){ultimoScan=now;processarQR(r.data);return;}
            }
        }
    }
    requestAnimationFrame(scanLoop);
}

function processarQR(data){
    scanning=false;
    var a=null;
    if(data.indexOf('ACQUACARD|')===0){
        var p=data.split('|');
        a=find(p[1]);
        if(!a)for(var i=0;i<db.length;i++)if(db[i].nome===p[2]){a=db[i];break;}
    }
    if(!a){
        mostrarErro('QR Code Inválido','Não reconhecido pelo sistema');
        return;
    }
    mostrarConfirmacao(a);
}

function mostrarErro(titulo,msg){
    var box=document.getElementById('resultCard');
    box.className='result-card ng show';
    box.innerHTML='<div class="result-icon">❌</div>'+
        '<div class="result-title">'+titulo+'</div>'+
        '<div class="result-info">'+msg+'</div>'+
        '<button class="btn-cancel" onclick="reiniciarScan()">Tentar Novamente</button>';
}

function mostrarConfirmacao(a){
    assocPendente=a;
    var ok=a.status==='Ativo';
    var box=document.getElementById('resultCard');
    box.className='result-card '+(ok?'ok':'ng')+' show';
    box.innerHTML=
        (a.foto?'<img src="'+a.foto+'" class="result-photo">':'<div class="result-icon">'+(ok?'✅':'⛔')+'</div>')+
        '<div class="result-title">'+(ok?'IDENTIFICADO':'BLOQUEADO')+'</div>'+
        '<div class="result-name">'+a.nome+'</div>'+
        '<div class="result-info">'+(a.emp?'🏢 '+a.emp+' · ':'')+'Status: '+a.status+'</div>'+
        '<div class="result-action">'+
            (ok?
                '<button class="btn-confirm" onclick="confirmarVisita()">✓ REGISTRAR ACESSO</button>':
                '<button class="btn-confirm" disabled style="background:#fff;color:#742a2a">⛔ ACESSO NEGADO</button>'
            )+
            '<br><button class="btn-cancel" onclick="reiniciarScan()">Cancelar / Próximo</button>'+
        '</div>';
}

function confirmarVisita(){
    if(!assocPendente)return;
    var a=assocPendente;
    var visita={
        id:'VP'+Date.now(),
        aid:a.id,
        nome:a.nome,
        emp:a.emp||'',
        parqueId:PARQUE_ATUAL.id,
        parqueNome:PARQUE_ATUAL.nome,
        tp:'ok',
        dt:hoje(),
        hr:agora(),
        di:hojeISO(),
        ts:Date.now()
    };
    fbPost('visitas_parceiros',visita,function(e){
        if(!e){
            visitasHoje.push(visita);
            renderHistorico();
            toast('✅ Acesso registrado: '+a.nome);
        }else{
            toast('⚠️ Erro ao salvar — verifique conexão');
        }
    });
    assocPendente=null;
    setTimeout(reiniciarScan,1500);
}

function reiniciarScan(){
    document.getElementById('resultCard').className='result-card';
    document.getElementById('resultCard').innerHTML='';
    assocPendente=null;
    scanning=true;
    setTimeout(scanLoop,300);
}

/* ===== INICIALIZAÇÃO ===== */
checarSessaoTotem();
</script>
</body>
</html>
